<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>March 2027 Cele Topnotchers’ Apartus Gastos</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#14213d;--mut:#5b6679;--line:#d9dfe8;--yel:#ffc400;--blu:#1b7fbf;--red:#c93a3a;--grn:#1f8a4c;--dark:#14213d;--okbg:#e2f4ea;--warnbg:#fdeaea;--midbg:#fff4d1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1524;--panel:#17213a;--ink:#e8edf6;--mut:#9aa7bf;--line:#2b3856;--dark:#0a1020;--okbg:#14382a;--warnbg:#41202a;--midbg:#43391a;--blu:#5ab4ee;--grn:#4cc882;--red:#ff7777}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1524;--panel:#17213a;--ink:#e8edf6;--mut:#9aa7bf;--line:#2b3856;--dark:#0a1020;--okbg:#14382a;--warnbg:#41202a;--midbg:#43391a;--blu:#5ab4ee;--grn:#4cc882;--red:#ff7777}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;margin:0;line-height:1.1}
h1{font-size:clamp(26px,5vw,44px);font-weight:800}
h2{font-size:22px;font-weight:800;margin-bottom:10px}
h3{font-size:16px;font-weight:600;margin:14px 0 6px}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin:10px 0 16px}
.sub{color:var(--mut);margin-top:6px}
.meter{background:var(--dark);color:#fff;border-radius:10px;padding:18px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;border-bottom:6px solid var(--yel)}
.meter .big{font:800 clamp(30px,7vw,52px)/1 "Bricolage Grotesque",sans-serif;color:var(--yel);letter-spacing:.04em}
.meter small{display:block;color:#b8c3d9}
.meter .col{min-width:130px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--blu);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{cursor:pointer;border:0;border-radius:6px;padding:8px 14px;background:var(--yel);color:#14213d;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.verdict{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:14px}
.verdict.ok{background:var(--okbg)}.verdict.warn{background:var(--warnbg)}.verdict.mid{background:var(--midbg)}
.verdict b{display:block;margin-bottom:2px}
.verdict ul{margin:4px 0 0;padding-left:18px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{font-weight:600;color:var(--mut)}
td input[type=number],td input[type=text]{min-width:70px}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.b-Paid{background:var(--okbg);color:var(--grn)}.b-Partial{background:var(--midbg)}.b-Unpaid{background:var(--warnbg);color:var(--red)}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--blu)}
.bar i.top1{background:var(--yel)}
.rank{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
@media (max-width:560px){.rank{grid-template-columns:100px 1fr 90px}}
.pred{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pred div{border:1px solid var(--line);border-radius:8px;padding:10px}
.pred b{font:800 20px "Bricolage Grotesque",sans-serif;display:block}
.note{color:var(--mut);font-size:13px;margin-top:8px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

.hero{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.grp{position:relative;width:170px;flex:none}
.grp img{width:100%;display:block;border-radius:10px;border-bottom:5px solid var(--yel)}
.grp .gn{position:absolute;font-size:22px;line-height:1;transform:translate(-50%,-85%);filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.who{display:flex;align-items:center;gap:10px}
.avw{position:relative;width:44px;height:44px;flex:none}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;display:block;border:2px solid var(--line)}
.avw .gn{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:20px;line-height:1}

.grp{width:240px}
.grp .gunimg,.gunimg{position:absolute;display:block;border:0;border-radius:0;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.gs{position:relative;width:46px;height:44px;flex:none;margin-right:-6px}
.gs .gunimg{left:2px;top:2px;width:40px;height:40px;transform:rotate(44deg)}
</style>
</head>

let S;
try{S=JSON.parse(document.getElementById('seed').textContent)}catch(e){S=null}
if(!S||!S.months)S={months:{},apps:null};
if(!S.apps)S.apps=DEF_APPS;
let CAN=location.hash==='#edit';
if(CAN){try{const l=JSON.parse(localStorage.getItem('apartus-data'));if(l&&l.months){S.months=l.months;if(l.apps)S.apps=l.apps}}catch(e){}}
S.cur=(()=>{try{const c=localStorage.getItem('apartus-cur');if(c)return c}catch(e){}const k=Object.keys(S.months).sort();return k.length?k[k.length-1]:'2026-10'})();
function save(){if(!CAN)return;try{localStorage.setItem('apartus-data',JSON.stringify({months:S.months,apps:S.apps}))}catch(e){}}
function downloadPage(){const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#grp').innerHTML='';
 c.querySelector('#seed').textContent=JSON.stringify({months:S.months,apps:S.apps}).replace(/</g,'\\u003c');
 const b=new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='index.html';document.body.appendChild(a);a.click();a.remove()}
function lock(){const b=document.getElementById('app'),n=document.createElement('div');
 if(CAN){n.className='verdict ok';n.innerHTML='<b>Edit mode</b>Your changes are saved in this browser only. To update what everyone sees, download the page and upload it to your host again.<p style="margin:8px 0 0"><button onclick="downloadPage()">Download updated page</button></p>';b.prepend(n)}
 else{b.querySelectorAll('input,select,button').forEach(x=>x.disabled=true);n.className='verdict mid';n.innerHTML='<b>View only</b>This page shows the latest figures the owner uploaded.';b.prepend(n)}}
const peso=n=>'₱'+(+n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=(k=S.cur)=>S.months[k]||(S.months[k]={e:{kwh:'',amt:''},w:{m3:'',amt:''},p:{}});
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const days=k=>{if(k==='2026-10')return 15;const[y,m]=k.split('-');return new Date(y,m-1,0).getDate()};
const perLbl=k=>{const[y,m]=k.split('-').map(Number);const a=k==='2026-10'?4:19,pm=k==='2026-10'?10:(m===1?12:m-1);return MN[pm-1]+' '+a+' – '+MN[m-1]+' 19, '+y};
const dueLbl=k=>{const n=nextKey(k).split('-');return MN[n[1]-1]+' 4, '+n[0]};
const DUE=k=>{const[y,m]=nextKey(k).split('-').map(Number);return new Date(y,m-1,4)};
const dleft=k=>Math.ceil((DUE(k)-new Date().setHours(0,0,0,0))/864e5);
const danger=p=>dleft(S.cur)<=5&&['rent','e','w'].some(t=>bill(t)>0&&pay(p,t).s==='Unpaid');
const GP={Tyrone:[60,172,44],Jr:[70,111,44],Lea:[121,28,134],Allyana:[170,66,179],Paolo:[186,172,224]};
function grp(){const g=document.getElementById('grp'),G=36,r=Math.PI/180;
 g.innerHTML='<img src="'+PHOTO+'" alt="Tyrone, Jr, Lea, Allyana and Paolo">'+PEOPLE.filter(p=>danger(p)).map(p=>{const[tx,ty,th]=GP[p],c=Math.cos(th*r),s=Math.sin(th*r),vx=0.412,vy=-0.439,cx=tx-(vx*c-vy*s)*G,cy=ty-(vx*s+vy*c)*G;
  return'<img class="gunimg" alt="" src="'+GUN+'" title="'+p+' is unpaid and due soon" style="width:'+G+'px;height:'+G+'px;left:'+(cx-G/2)+'px;top:'+(cy-G/2)+'px;transform:rotate('+th+'deg)">'}).join('')}
const nextKey=k=>{let[y,m]=k.split('-').map(Number);m++;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};
const lbl=k=>{const[y,m]=k.split('-');return new Date(y,m-1,1).toLocaleString('en',{month:'long',year:'numeric'})};
const appKwh=(a,d)=>a.w*a.q*a.h*d/1000;
const pay=(p,t)=>{const m=M();return m.p[p+'|'+t]||(m.p[p+'|'+t]={s:'Unpaid',a:0})};
const bill=(t,k=S.cur)=>t==='rent'?RENT:+M(k)[t==='e'?'e':'w'].amt||0;
const share=(t,k)=>bill(t,k)/N;
const paidAmt=(p,t)=>{const x=pay(p,t),s=share(t);return x.s==='Paid'?s:x.s==='Partial'?Math.min(+x.a||0,s):0};
const recorded=()=>Object.keys(S.months).filter(k=>k<=S.cur&&(+S.months[k].e.amt>0||+S.months[k].w.amt>0)).sort();

function elecVerdict(){
 const e=M().e,kwh=+e.kwh,amt=+e.amt;if(!kwh||!amt)return'';
 const d=days(S.cur),rate=amt/kwh,est=S.apps.reduce((s,a)=>s+appKwh(a,d),0),f=[];let bad=0;
 f.push(`Effective rate is <b>${peso(rate)}/kWh</b> (your first bill was ₱16.28/kWh; ₱12–19 is normal for your Meralco bill).`);
 if(rate>19){bad++;f.push('Rate is higher than usual. Check for arrears, penalties or a wrong kWh entry.')}
 else if(rate<12){bad++;f.push('Rate is lower than usual. Check that kWh and amount were typed correctly.')}
 f.push(`Your appliance list adds up to about <b>${est.toFixed(0)} kWh</b>; the bill says ${kwh} kWh.`);
 if(kwh>est*1.3){bad++;f.push('Bill is well above the appliance estimate. Either some appliances are missing or hours are underestimated.')}
 else if(kwh<est*0.7)f.push('Bill is below the estimate, so the hours listed may be too high.');
 const prev=recorded().filter(k=>k<S.cur).map(k=>+S.months[k].e.amt/days(k)*days(S.cur)).filter(x=>x>0);
 if(prev.length){const av=prev.reduce((a,b)=>a+b)/prev.length,ch=(amt-av)/av*100;
  f.push(`Compared with your past average (${peso(av)}): <b>${ch>=0?'+':''}${ch.toFixed(0)}%</b>.`);if(ch>25){bad++;f.push('That is a big jump. See which appliances were used more.')}}
 const c=bad===0?'ok':bad===1?'mid':'warn',t=bad===0?'Looks reasonable':bad===1?'Worth a second look':'Looks off, please double check';
 return`<div class="verdict ${c}"><b>${t}</b><ul>${f.map(x=>'<li>'+x+'</li>').join('')}</ul></div>`}

function waterVerdict(){
 const w=M().w,m3=+w.m3,amt=+(w.full||w.amt);if(!m3||!amt)return'';
 const d=days(S.cur),lpd=m3*1000/N/d,rate=amt/m3,f=[];let bad=0;
 f.push(`Use per person: <b>${lpd.toFixed(0)} litres/day</b> (a typical range is 80–150).`);
 if(lpd>200){bad++;f.push('Very high. Check for a leaking toilet or faucet: turn everything off and see if the meter still moves.')}
 else if(lpd>150)f.push('A little high. Shorter showers and full laundry loads help.');
 f.push(`Effective rate: <b>${peso(rate)}/m³</b> (your building’s water bill charges ₱97/m³).`);
 if(rate>130||rate<30){bad++;f.push('Rate is outside the usual range. Check the entries.')}
 const prev=recorded().filter(k=>k<S.cur).map(k=>+(S.months[k].w.full||S.months[k].w.amt)/days(k)*days(S.cur)).filter(x=>x>0);
 if(prev.length){const av=prev.reduce((a,b)=>a+b)/prev.length,ch=(amt-av)/av*100;f.push(`Compared with your past average (${peso(av)}): <b>${ch>=0?'+':''}${ch.toFixed(0)}%</b>.`);if(ch>30)bad++}
 const c=bad===0?'ok':bad===1?'mid':'warn';
 return`<div class="verdict ${c}"><b>${bad===0?'Looks reasonable':bad===1?'Worth a second look':'Looks off, please double check'}</b><ul>${f.map(x=>'<li>'+x+'</li>').join('')}</ul></div>`}

const TIPS=[[/aircon|air con|ac\b/i,'Set it to 25–26°C, use the sleep timer, clean the filter monthly and keep doors closed. An inverter unit saves a lot if you replace it later.'],

 [/laptop|pc/i,'Enable sleep mode and unplug chargers when not in use.'],
 [/tv/i,'Use the sleep timer and switch it off at the socket.'],

function appliances(){
 const d=days(S.cur),rate=(+M().e.kwh&&+M().e.amt)?M().e.amt/M().e.kwh:16.28;
 const rows=S.apps.map((a,i)=>({...a,i,k:appKwh(a,d)})),tot=rows.reduce((s,r)=>s+r.k,0)||1;
 const rk=[...rows].sort((a,b)=>b.k-a.k),mx=rk[0]?rk[0].k||1:1;
 const top=rk.slice(0,3).filter(r=>r.k>0);
 let h=`<h2>Appliances and usage</h2><p class="sub" style="margin:0 0 8px">Estimated from watts × quantity × hours per day × ${d} days in this billing period, priced at ${peso(rate)}/kWh.</p>`;
 h+=rk.map((r,j)=>`<div class="rank"><span>${esc(r.n)}</span><div class="bar"><i class="${j===0?'top1':''}" style="width:${r.k/mx*100}%"></i></div><span class="num">${r.k.toFixed(0)} kWh · ${(r.k/tot*100).toFixed(0)}%</span></div>`).join('');
 h+=`<h3>What to do next</h3><ul style="margin:0;padding-left:18px">`;
 top.forEach(r=>{const t=(TIPS.find(x=>x[0].test(r.n))||[0,'Reduce hours of use or replace with a more efficient model.'])[1],sv=r.w*r.q*d/1000;
  h+=`<li><b>${esc(r.n)}</b> uses ${(r.k/tot*100).toFixed(0)}% of your electricity. ${t} Cutting just 1 hour a day saves about ${sv.toFixed(0)} kWh, or ${peso(sv*rate)} a month.</li>`});
 h+=`<li>Agree on house rules together: lights and fans off in empty rooms, one person checks the aircon timer at night.</li></ul>`;
 h+=`<h3>Edit appliances</h3><div class="scroll"><table><tr><th>Appliance</th><th>Watts</th><th>Qty</th><th>Hours/day</th><th></th></tr>`;
 h+=S.apps.map((a,i)=>`<tr><td><input type="text" value="${esc(a.n)}" aria-label="Name" onchange="upA(${i},'n',this.value)"></td><td><input type="number" min="0" value="${a.w}" aria-label="Watts" onchange="upA(${i},'w',this.value)"></td><td><input type="number" min="0" value="${a.q}" aria-label="Quantity" onchange="upA(${i},'q',this.value)"></td><td><input type="number" min="0" max="24" step="0.5" value="${a.h}" aria-label="Hours per day" onchange="upA(${i},'h',this.value)"></td><td><button class="ghost" onclick="delA(${i})" aria-label="Remove ${esc(a.n)}">Remove</button></td></tr>`).join('');
 return h+`</table></div><p style="margin-top:10px"><button onclick="addA()">Add appliance</button></p>`}

function payments(){
 const T=[['rent','Rent'],['e','Electricity'],['w','Water']];
 let h=`<h2>Who has paid</h2><p class="sub" style="margin:0 0 8px">Due ${dueLbl(S.cur)} (${dleft(S.cur)<0?-dleft(S.cur)+' days overdue':dleft(S.cur)===0?'today':dleft(S.cur)+' days left'}). A gun is pointed at anyone still unpaid with 5 days or less to go. Each person’s share is the bill divided by ${N}. Choose Partial to enter how much was paid so far.</p><div class="scroll"><table><tr><th>Occupant</th>${T.map(t=>`<th>${t[1]}<br><span class="num" style="font-weight:400">${peso(share(t[0]))} each</span></th>`).join('')}<th>Still owes</th></tr>`;
 PEOPLE.forEach(p=>{let owe=0;
  h+=`<tr><td><div class="who"><span class="gs">${danger(p)?'<img class="gunimg" alt="Gun pointed at '+p+'" src="'+GUN+'">':''}</span><div class="avw"><img class="av" alt="" src="${FACE[p]}"></div><b>${p}</b></div></td>`;
  T.forEach(([t])=>{const x=pay(p,t),s=share(t);owe+=s-paidAmt(p,t);
   h+=`<td><select aria-label="${p} ${t} status" onchange="setP('${p}','${t}','s',this.value)">${['Unpaid','Partial','Paid'].map(o=>`<option${x.s===o?' selected':''}>${o}</option>`).join('')}</select>`+
   (x.s==='Partial'?`<input type="number" min="0" max="${s}" step="0.01" value="${x.a||''}" placeholder="Paid so far" aria-label="${p} ${t} amount paid" style="margin-top:4px" onchange="setP('${p}','${t}','a',this.value)">`:'')+
   `<div class="note num"><span class="badge b-${x.s}">${x.s}</span> ${peso(paidAmt(p,t))}</div></td>`});
  h+=`<td class="num"><b>${peso(owe)}</b></td></tr>`});
 return h+`</table></div>`}

function predict(){
 const ks=recorded(),nk=nextKey(S.cur),d=days(nk),est=S.apps.reduce((s,a)=>s+appKwh(a,d),0);
 const proj=f=>{const v=ks.map(k=>+(S.months[k][f].full||S.months[k][f].amt)/days(k)*d).filter(x=>x>0).slice(-3);if(!v.length)return null;
  let sw=0,s=0;v.forEach((x,i)=>{sw+=i+1;s+=x*(i+1)});return s/sw};
 let e=proj('e'),w=proj('w'),eb='your saved bills, scaled to the days in that period',wb='your saved bills, scaled to the days in that period (the one-time October discount is ignored)';
 if(e==null){e=est*16.28;eb='appliance estimate at ₱16.28/kWh (no bills saved yet)'}
 if(w==null){w=N*4*50;wb='typical use of 4 m³ per person at ₱50/m³ (no bills saved yet)'}
 const tot=e+w+RENT;
 if(nk>'2027-03')return'<h2>Forecast</h2><p>The lease ends Apr 4, 2027, so the March 2027 cut-off is your last bill.</p>';return`<h2>Forecast: ${perLbl(nk)} (due ${dueLbl(nk)})</h2><div class="pred"><div>Electricity<b class="num">${peso(e)}</b><span class="note">likely ${peso(e*.9)} to ${peso(e*1.1)}</span></div><div>Water<b class="num">${peso(w)}</b><span class="note">likely ${peso(w*.9)} to ${peso(w*1.1)}</span></div><div>Rent<b class="num">${peso(RENT)}</b><span class="note">fixed</span></div><div>Total<b class="num">${peso(tot)}</b><span class="note">${peso(tot/N)} per person</span></div></div><p class="note">Electricity: ${eb}. Water: ${wb}. Forecasts get better as you save more months.</p>`}

function history(){
 const ks=Object.keys(S.months).sort().filter(k=>+S.months[k].e.amt>0||+S.months[k].w.amt>0);
 if(!ks.length)return'';
 return`<h2>Past months</h2><div class="scroll"><table><tr><th>Month</th><th>Electricity</th><th>kWh</th><th>Water</th><th>m³</th><th>Total</th></tr>${ks.map(k=>{const m=S.months[k];return`<tr><td>${lbl(k)}</td><td class="num">${peso(m.e.amt)}</td><td>${m.e.kwh||'-'}</td><td class="num">${peso(m.w.amt)}</td><td>${m.w.m3||'-'}</td><td class="num"><b>${peso(RENT+(+m.e.amt||0)+(+m.w.amt||0))}</b></td></tr>`}).join('')}</table></div>`}

function render(){
 const m=M(),total=RENT+bill('e')+bill('w');
 let paid=0;PEOPLE.forEach(p=>['rent','e','w'].forEach(t=>paid+=paidAmt(p,t)));
 let h=`<div class="meter"><div class="col"><small>Total due ${dueLbl(S.cur)} · bills for ${perLbl(S.cur)}</small><div class="big num">${peso(total)}</div></div><div class="col"><small>Each person pays</small><b class="num" style="font-size:22px">${peso(total/N)}</b></div><div class="col"><small>Collected so far</small><b class="num" style="font-size:22px">${peso(paid)}</b></div><div class="col"><small>Still to collect</small><b class="num" style="font-size:22px;color:var(--yel)">${peso(total-paid)}</b></div></div>`;
 h+=`<div class="grid"><section><h2>Electricity bill</h2><div class="row2"><div><label for="ek">Usage (kWh)</label><input id="ek" type="number" min="0" value="${m.e.kwh}" onchange="up('e','kwh',this.value)"></div><div><label for="ea">Amount due (₱)</label><input id="ea" type="number" min="0" step="0.01" value="${m.e.amt}" onchange="up('e','amt',this.value)"></div></div>${elecVerdict()||'<p class="note">Enter the kWh and amount from the Meralco bill to check if it is reasonable.</p>'}${m.e.note?'<p class="note">'+esc(m.e.note)+'</p>':''}</section>
 <section><h2>Water bill</h2><div class="row2"><div><label for="wm">Usage (m³)</label><input id="wm" type="number" min="0" value="${m.w.m3}" onchange="up('w','m3',this.value)"></div><div><label for="wa">Amount due (₱)</label><input id="wa" type="number" min="0" step="0.01" value="${m.w.amt}" onchange="up('w','amt',this.value)"></div></div>${waterVerdict()||'<p class="note">Enter the cubic meters and amount from the water bill to check it.</p>'}${m.w.note?'<p class="note">'+esc(m.w.note)+'</p>':''}</section></div>`;
 h+=`<section>${payments()}</section><section>${appliances()}</section><section>${predict()}</section>`;
 const hs=history();if(hs)h+=`<section>${hs}</section>`;
 const a=document.activeElement&&document.activeElement.id;
 document.getElementById('app').innerHTML=h;grp();lock();
}
function up(t,f,v){M()[t][f]=v;save();render()}
function setP(p,t,f,v){const x=pay(p,t);x[f]=f==='a'?+v:v;save();render()}
function upA(i,f,v){S.apps[i][f]=f==='n'?v:Math.max(0,+v||0);save();render()}
function delA(i){S.apps.splice(i,1);save();render()}
function addA(){S.apps.push({n:'New appliance',w:100,q:1,h:1});save();render()}
const mon=document.getElementById('mon');mon.value=S.cur;
mon.onchange=()=>{if(mon.value){S.cur=mon.value;try{localStorage.setItem('apartus-cur',mon.value)}catch(e){}render()}};
render();
addEventListener('hashchange',()=>location.reload());
</script>
</body>
</html>
